<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Undangan Ulang Tahun Athar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:'Poppins',sans-serif;
}

/* ========== UNDANGAN ========== */
#invitation{
    min-height:100vh;
    padding:40px 20px;
    background:#0b4db8 url("mobil.jpg") repeat;
    background-size:80px;
}

.card{
    background:white;
    max-width:380px;
    margin:0 auto 20px;
    border-radius:25px;
    padding:28px;
    text-align:center;
    box-shadow:0 25px 45px rgba(0,0,0,.25);
}

.card img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:20px;
    margin-bottom:15px;
}

.highlight{
    font-weight:600;
    color:#1e90ff;
}

.nama-anak{
    font-weight:600;
    font-size:18px;
    margin:10px 0;
}

/* ========== MAPS BOX ========== */
.map-box{
    background:white;
    max-width:380px;
    margin:auto;
    border-radius:25px;
    padding:15px;
    box-shadow:0 25px 45px rgba(0,0,0,.25);
    text-align:center;
}

.map-box h3{
    margin:5px 0 10px;
    color:#1e90ff;
    font-size:18px;
}

.map-box iframe{
    width:100%;
    height:220px;
    border:none;
    border-radius:15px;
}

.map-box a{
    display:inline-block;
    margin-top:10px;
    text-decoration:none;
    background:#1e90ff;
    color:white;
    padding:10px 18px;
    border-radius:20px;
    font-weight:600;
}
</style>
</head>

<body>

<!-- ========== UNDANGAN ========== -->
<div id="invitation">

    <div class="card">
        <img src="athar.jpg" alt="Foto Athar">

        <p class="highlight">Halo Teman Teman 👋</p>
        <p>Datang yah ke ulang tahun aku</p>

        <p class="nama-anak">"Muhamad Athar Rasyah Mirham"</p>

        <p>📅 Senin 19 Januari 2026</p>
        <p>⏰ pukul 10.00</p>
        <p>📍 Rumah Athar (kaballokan)</p>
    </div>

    <!-- MAPS -->
    <div class="map-box">
        <h3>📍 Lokasi Rumah Athar</h3>

        <!-- IFRAME PAKAI KOORDINAT (PASTI MUNCUL) -->
        <iframe
            src="https://www.google.com/maps?q=-7.121809,120.260774&output=embed"
            loading="lazy">
        </iframe>

        <!-- TOMBOL PAKAI LINK ASLI -->
        <a href="https://maps.app.goo.gl/gewCeCrbPpbVycUE6" target="_blank">
            🧭 Buka di Google Maps
        </a>
    </div>

</div>

</body>
</html>
